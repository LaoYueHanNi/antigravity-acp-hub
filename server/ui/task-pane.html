<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACP 任务台</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-primary: var(--color-background-primary, #f7f8fa);
        --bg-secondary: var(--color-background-secondary, #ffffff);
        --bg-tertiary: var(--color-background-tertiary, #eef1f5);
        --bg-info: var(--color-background-info, #e8f1ff);
        --bg-success: var(--color-background-success, #e6f6ec);
        --bg-warning: var(--color-background-warning, #fff4df);
        --bg-danger: var(--color-background-danger, #fdecec);

        --text-primary: var(--color-text-primary, #171a1f);
        --text-secondary: var(--color-text-secondary, #535c6a);
        --text-tertiary: var(--color-text-tertiary, #7a8391);
        --text-disabled: var(--color-text-disabled, #9aa2af);
        --text-info: var(--color-text-info, #1c5ed6);
        --text-success: var(--color-text-success, #16794b);
        --text-warning: var(--color-text-warning, #9a5b00);
        --text-danger: var(--color-text-danger, #c62828);

        --border-primary: var(--color-border-primary, #dde2ea);
        --border-secondary: var(--color-border-secondary, #ebeff5);
        --border-info: var(--color-border-info, #b6d1ff);
        --border-success: var(--color-border-success, #a7e0bf);
        --border-warning: var(--color-border-warning, #f6d18a);
        --border-danger: var(--color-border-danger, #f5b9b9);

        --ring-primary: var(--color-ring-primary, #2563eb);
        --font-family: var(
          --font-sans,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif
        );
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        --radius-sm: 6px;
        --radius-md: 10px;
        --scrollbar-thumb: rgba(15, 23, 42, 0.2);
        --scrollbar-thumb-hover: rgba(15, 23, 42, 0.36);
      }

      :root[data-theme="dark"] {
        --bg-primary: var(--color-background-primary, #14161a);
        --bg-secondary: var(--color-background-secondary, #1c1f26);
        --bg-tertiary: var(--color-background-tertiary, #252a33);
        --bg-info: var(--color-background-info, #182b4a);
        --bg-success: var(--color-background-success, #133325);
        --bg-warning: var(--color-background-warning, #3a2b12);
        --bg-danger: var(--color-background-danger, #3d1c1e);

        --text-primary: var(--color-text-primary, #eef1f6);
        --text-secondary: var(--color-text-secondary, #aeb6c4);
        --text-tertiary: var(--color-text-tertiary, #7f8899);
        --text-disabled: var(--color-text-disabled, #616978);
        --text-info: var(--color-text-info, #7db1ff);
        --text-success: var(--color-text-success, #6be0a6);
        --text-warning: var(--color-text-warning, #f7c56b);
        --text-danger: var(--color-text-danger, #ff8f8f);

        --border-primary: var(--color-border-primary, #2e3440);
        --border-secondary: var(--color-border-secondary, #242933);
        --border-info: var(--color-border-info, #27487d);
        --border-success: var(--color-border-success, #1f5c41);
        --border-warning: var(--color-border-warning, #6b4e1a);
        --border-danger: var(--color-border-danger, #6e2d31);
        --scrollbar-thumb: rgba(255, 255, 255, 0.16);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
      }

      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 999px;
      }

      *:hover::-webkit-scrollbar-thumb,
      *.is-scrolling::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-family);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      /* Top bar + task tabs */
      .pane-topbar {
        flex-shrink: 0;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-primary);
        padding: 9px 12px 7px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .topbar-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .topbar-title {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .topbar-logo {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--bg-info);
        border: 1px solid var(--border-info);
        color: var(--text-info);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 10px;
        flex-shrink: 0;
      }

      .topbar-heading {
        font-size: 13.5px;
        font-weight: 650;
        margin: 0;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      .pill-alert {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border-warning);
        background: var(--bg-warning);
        color: var(--text-warning);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-primary);
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: var(--bg-tertiary);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-sm {
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
      }

      .btn-primary {
        background: var(--text-info);
        border-color: var(--text-info);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        opacity: 0.92;
        background: var(--text-info);
      }

      .btn-success {
        background: var(--bg-success);
        border-color: var(--border-success);
        color: var(--text-success);
      }

      .btn-danger {
        background: var(--bg-danger);
        border-color: var(--border-danger);
        color: var(--text-danger);
      }

      .btn-ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-secondary);
      }

      .btn-ghost:hover:not(:disabled) {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .btn-active {
        background: var(--bg-info);
        border-color: var(--border-info);
        color: var(--text-info);
      }

      .task-tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .task-tab {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 7px;
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 11.5px;
        cursor: pointer;
        max-width: 200px;
        flex-shrink: 0;
        transition: all 0.12s ease;
      }

      .task-tab:hover {
        border-color: var(--border-info);
        color: var(--text-primary);
      }

      .task-tab.active {
        background: var(--bg-info);
        border-color: var(--border-info);
        color: var(--text-primary);
        font-weight: 600;
      }

      .task-tab-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .task-tab-harness {
        font-size: 10px;
        padding: 0 4px;
        border-radius: 4px;
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        text-transform: uppercase;
        flex-shrink: 0;
      }

      .task-tab-badge {
        font-size: 10px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--text-warning);
        color: #ffffff;
        font-weight: 700;
        flex-shrink: 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        flex-shrink: 0;
      }

      .dot-running {
        background: var(--text-info);
        animation: pulse 1.3s ease-in-out infinite;
      }

      .dot-waiting_approval {
        background: var(--text-warning);
        animation: pulse 1s ease-in-out infinite;
      }

      .dot-completed {
        background: var(--text-success);
      }

      .dot-failed {
        background: var(--text-danger);
      }

      .dot-cancelled {
        background: var(--text-tertiary);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.85);
        }
      }

      /* Active task metadata header */
      .task-header {
        flex-shrink: 0;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-secondary);
        padding: 7px 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .task-header-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .task-header-title {
        font-size: 13px;
        font-weight: 650;
        margin: 0;
        word-break: break-word;
      }

      .task-meta-chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
        color: var(--text-secondary);
        font-size: 11px;
        max-width: 100%;
      }

      .chip-info {
        background: var(--bg-info);
        border-color: var(--border-info);
        color: var(--text-info);
      }

      .chip-success {
        background: var(--bg-success);
        border-color: var(--border-success);
        color: var(--text-success);
      }

      .chip-warning {
        background: var(--bg-warning);
        border-color: var(--border-warning);
        color: var(--text-warning);
      }

      .chip-danger {
        background: var(--bg-danger);
        border-color: var(--border-danger);
        color: var(--text-danger);
      }

      .chip-mono {
        font-family: var(--font-mono);
        font-size: 10.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
      }

      /* Sticky Plan & Files Bar + Drawer (always visible regardless of scroll) */
      .sticky-bar-wrap {
        flex-shrink: 0;
        background: var(--bg-primary);
        border-bottom: 1px solid var(--border-primary);
        display: flex;
        flex-direction: column;
      }

      .sticky-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        flex-wrap: wrap;
      }

      .drawer-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 9px;
        border-radius: 6px;
        border: 1px solid var(--border-primary);
        background: var(--bg-secondary);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.12s ease;
      }

      .drawer-toggle:hover {
        border-color: var(--border-info);
        color: var(--text-primary);
      }

      .drawer-toggle.open {
        background: var(--bg-info);
        border-color: var(--border-info);
        color: var(--text-info);
        font-weight: 600;
      }

      .drawer-count {
        font-family: var(--font-mono);
        font-size: 10.5px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .drawer-toggle.open .drawer-count {
        background: var(--bg-secondary);
        color: var(--text-info);
      }

      .sticky-drawer {
        border-top: 1px solid var(--border-secondary);
        background: var(--bg-secondary);
        padding: 8px 12px;
        max-height: 210px;
        overflow-y: auto;
      }

      /* Sticky Approvals Bar (always pinned above scroll) */
      .sticky-approvals {
        flex-shrink: 0;
        padding: 8px 12px;
        background: var(--bg-primary);
        border-bottom: 1px solid var(--border-warning);
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 44vh;
        overflow-y: auto;
      }

      .approval-card {
        background: var(--bg-warning);
        border: 1px solid var(--border-warning);
        border-radius: var(--radius-md);
        padding: 9px 11px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .approval-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .approval-title {
        font-weight: 650;
        color: var(--text-warning);
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
      }

      .approval-countdown {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-warning);
        flex-shrink: 0;
      }

      .approval-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      /* Plan list */
      .plan-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .plan-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 12px;
      }

      .plan-item.completed {
        color: var(--text-tertiary);
        text-decoration: line-through;
      }

      .plan-item.in_progress {
        color: var(--text-info);
        font-weight: 550;
      }

      .plan-icon {
        font-family: var(--font-mono);
        font-size: 11px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Files touched */
      .files-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 11px;
        cursor: pointer;
        max-width: 100%;
        text-align: left;
      }

      .file-chip:hover {
        border-color: var(--border-info);
        background: var(--bg-info);
        color: var(--text-info);
      }

      .file-chip-path {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 260px;
      }

      .file-act {
        font-family: var(--font-family);
        font-size: 10px;
        font-weight: 600;
        padding: 0 4px;
        border-radius: 3px;
        flex-shrink: 0;
      }

      .file-act-edit {
        background: var(--bg-warning);
        color: var(--text-warning);
      }

      .file-act-read {
        background: var(--bg-info);
        color: var(--text-info);
      }

      .file-act-delete {
        background: var(--bg-danger);
        color: var(--text-danger);
      }

      .file-act-other {
        background: var(--bg-tertiary);
        color: var(--text-secondary);
      }

      /* Scrollable message timeline */
      .pane-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 10px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .turn-block {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding-bottom: 11px;
        border-bottom: 1px dashed var(--border-primary);
      }

      .turn-block:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .prompt-bubble {
        background: var(--bg-tertiary);
        border: 1px solid var(--border-primary);
        border-left: 3px solid var(--text-info);
        border-radius: var(--radius-md);
        padding: 7px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .prompt-bubble.role-user {
        border-left-color: var(--text-warning);
      }

      .prompt-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--text-tertiary);
      }

      .role-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 650;
        padding: 1px 6px;
        border-radius: 5px;
      }

      .role-tag-agent {
        background: var(--bg-info);
        color: var(--text-info);
      }

      .role-tag-user {
        background: var(--bg-warning);
        color: var(--text-warning);
      }

      .role-tag-assistant {
        background: var(--bg-success);
        color: var(--text-success);
      }

      .prompt-text {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12.5px;
        max-height: 22vh;
        overflow-y: auto;
        padding-right: 2px;
      }

      .prompt-bubble.is-expanded .prompt-text {
        max-height: none;
        overflow-y: visible;
      }

      /* Thought box with persistent scroll position */
      .thought-box {
        background: var(--bg-secondary);
        border: 1px solid var(--border-secondary);
        border-radius: var(--radius-sm);
      }

      .thought-summary {
        list-style: none;
        padding: 5px 9px;
        cursor: pointer;
        font-size: 11.5px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
      }

      .thought-summary::-webkit-details-marker {
        display: none;
      }

      .thought-content {
        padding: 6px 9px 8px;
        border-top: 1px solid var(--border-secondary);
        font-size: 12px;
        color: var(--text-secondary);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 180px;
        overflow-y: auto;
      }

      /* Collapsible Tool Group */
      .tool-group {
        background: var(--bg-secondary);
        border: 1px solid var(--border-primary);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }

      .tool-group-summary {
        list-style: none;
        padding: 6px 9px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--text-secondary);
        user-select: none;
      }

      .tool-group-summary::-webkit-details-marker {
        display: none;
      }

      .tool-group-summary:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }

      .tool-group-left {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }

      .tool-group-hint {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-tertiary);
      }

      .tool-group-body {
        border-top: 1px solid var(--border-secondary);
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--bg-primary);
        max-height: 32vh;
        overflow-y: auto;
      }

      .tool-item {
        background: var(--bg-secondary);
        border: 1px solid var(--border-secondary);
        border-radius: var(--radius-sm);
      }

      .tool-summary {
        list-style: none;
        padding: 5px 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }

      .tool-summary::-webkit-details-marker {
        display: none;
      }

      .tool-summary-left {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .tool-name {
        font-family: var(--font-mono);
        font-size: 11.5px;
        font-weight: 600;
        flex-shrink: 0;
      }

      .tool-title {
        color: var(--text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11.5px;
      }

      .tool-status {
        font-size: 10.5px;
        color: var(--text-tertiary);
        flex-shrink: 0;
      }

      .tool-body {
        padding: 6px 9px 8px;
        border-top: 1px solid var(--border-secondary);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 11.5px;
      }

      /* Diff / code preview */
      .preview-pre {
        margin: 0;
        padding: 7px 9px;
        border-radius: 6px;
        background: var(--bg-primary);
        border: 1px solid var(--border-primary);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.45;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
      }

      .diff-grid {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .diff-del {
        background: var(--bg-danger);
        border: 1px solid var(--border-danger);
        color: var(--text-danger);
      }

      .diff-add {
        background: var(--bg-success);
        border: 1px solid var(--border-success);
        color: var(--text-success);
      }

      /* Markdown response */
      .assistant-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-primary);
        border-left: 3px solid var(--text-success);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .assistant-card.is-streaming {
        border-left-color: var(--text-info);
      }

      .assistant-card.is-error {
        border-left-color: var(--text-danger);
      }

      .assistant-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bg-primary);
        border-bottom: 1px solid var(--border-secondary);
        font-size: 11.5px;
      }

      .assistant-header-left {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .assistant-reply-to {
        font-size: 11px;
        color: var(--text-tertiary);
      }

      .assistant-body {
        padding: 9px 12px 10px;
        max-height: 55vh;
        overflow-y: auto;
      }

      .assistant-card.is-expanded .assistant-body {
        max-height: none;
        overflow-y: visible;
      }

      .assistant-header-right {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .stream-cursor {
        display: inline-block;
        width: 6px;
        height: 13px;
        margin-left: 3px;
        vertical-align: -2px;
        border-radius: 1px;
        background: var(--text-info);
        animation: cursor-blink 0.9s steps(2, start) infinite;
      }

      @keyframes cursor-blink {
        0%,
        100% {
          opacity: 0.9;
        }
        50% {
          opacity: 0.15;
        }
      }

      .md-block {
        animation: chunk-fade 0.14s ease-out;
      }

      @keyframes chunk-fade {
        from {
          opacity: 0.55;
        }
        to {
          opacity: 1;
        }
      }

      .stream-indicator {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--text-tertiary);
      }

      .markdown-body {
        font-size: 13px;
        line-height: 1.6;
        word-break: break-word;
      }

      .markdown-body > *:first-child {
        margin-top: 0;
      }

      .markdown-body > *:last-child {
        margin-bottom: 0;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin: 12px 0 6px;
        font-weight: 650;
        line-height: 1.3;
      }

      .markdown-body h1 {
        font-size: 15.5px;
      }
      .markdown-body h2 {
        font-size: 14px;
      }
      .markdown-body h3 {
        font-size: 13px;
      }

      .markdown-body p {
        margin: 6px 0;
      }

      .markdown-body ul,
      .markdown-body ol {
        margin: 6px 0;
        padding-left: 20px;
      }

      .markdown-body li {
        margin: 2px 0;
      }

      .markdown-body blockquote {
        margin: 8px 0;
        padding: 4px 10px;
        border-left: 3px solid var(--border-info);
        background: var(--bg-primary);
        color: var(--text-secondary);
      }

      .markdown-body code {
        font-family: var(--font-mono);
        font-size: 11.5px;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--bg-tertiary);
      }

      .md-code-wrap {
        margin: 8px 0;
        border: 1px solid var(--border-primary);
        border-radius: 7px;
        overflow: hidden;
        background: var(--bg-primary);
      }

      .md-code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 8px;
        background: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-primary);
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-secondary);
      }

      .md-code-wrap pre {
        margin: 0;
        padding: 8px 10px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .md-code-wrap pre code {
        padding: 0;
        background: transparent;
      }

      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 12px;
      }

      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border-primary);
        padding: 4px 7px;
        text-align: left;
      }

      .markdown-body th {
        background: var(--bg-tertiary);
        font-weight: 600;
      }

      .markdown-body a {
        color: var(--text-info);
        text-decoration: underline;
        cursor: pointer;
      }

      .notice-box {
        border-radius: var(--radius-sm);
        padding: 7px 10px;
        font-size: 12px;
      }

      .notice-warn {
        background: var(--bg-warning);
        border: 1px solid var(--border-warning);
        color: var(--text-warning);
      }

      .notice-err {
        background: var(--bg-danger);
        border: 1px solid var(--border-danger);
        color: var(--text-danger);
      }

      .notice-info {
        background: var(--bg-info);
        border: 1px solid var(--border-info);
        color: var(--text-info);
      }

      /* Empty state */
      .empty-state {
        margin: auto;
        max-width: 360px;
        text-align: center;
        padding: 28px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
      }

      .empty-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--bg-info);
        border: 1px solid var(--border-info);
        color: var(--text-info);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
      }

      /* Sticky footer */
      .pane-footer {
        flex-shrink: 0;
        background: var(--bg-secondary);
        border-top: 1px solid var(--border-primary);
        padding: 7px 12px 9px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .handoff-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .composer {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .composer-textarea {
        width: 100%;
        min-height: 48px;
        max-height: 130px;
        resize: vertical;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 12.5px;
        padding: 6px 9px;
        outline: none;
      }

      .composer-textarea:focus {
        border-color: var(--ring-primary);
      }

      .composer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .policy-select {
        height: 26px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-primary);
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 11.5px;
        padding: 0 6px;
      }

      .toast {
        position: fixed;
        right: 12px;
        bottom: 12px;
        max-width: calc(100% - 24px);
        padding: 7px 12px;
        border-radius: 8px;
        background: var(--text-primary);
        color: var(--bg-primary);
        font-size: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="root" class="app-shell">
      <header class="pane-topbar">
        <div class="topbar-row">
          <div class="topbar-title">
            <span class="topbar-logo">ACP</span>
            <h1 class="topbar-heading">ACP 任务台</h1>
          </div>
          <span class="chip">连接中…</span>
        </div>
      </header>
      <main class="pane-scroll">
        <div class="empty-state">
          <div class="empty-icon">ACP</div>
          <div style="font-size:13px;font-weight:600;color:var(--text-primary);">正在加载 ACP 任务台…</div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module">
/*__ACP_HUB_UI_JS__*/
    </script>
  </body>
</html>
